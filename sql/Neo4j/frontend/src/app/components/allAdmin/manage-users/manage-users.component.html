<div class="manage-users">
    <h2>Manage Users</h2>
  
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Role</th>
          <!-- <th>Actions</th> -->
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.ID }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.role }}</td>
          <!-- <td>
            <button (click)="editUser(user)">Edit</button>
            <button (click)="deleteUserById(user.ID)">Delete</button>
          </td> -->
        </tr>
      </tbody>
    </table>
  </div>
